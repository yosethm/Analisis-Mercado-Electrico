name: Update stats cards UI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update_stats_cards.yml'

permissions:
  contents: write

jobs:
  update-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update statistics cards
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('xm.py')
          text = p.read_text(encoding='utf-8')
          css = (
              '    /* Tarjetas compactas para estadísticas descriptivas */\n'
              '    .stats-shell { max-width: 1080px; margin: 4px auto 22px auto; padding: 2px 4px; }\n'
              '    .stats-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 14px; }\n'
              '    .stat-card { position: relative; min-width: 0; padding: 18px 16px 16px; border-radius: 22px; border: 1px solid rgba(67,101,139,.13); background: linear-gradient(145deg, rgba(255,255,255,.98), rgba(246,249,252,.96)); box-shadow: 0 8px 22px rgba(30,61,89,.08); overflow: hidden; transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease; }\n'
              '    .stat-card::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: linear-gradient(90deg, var(--highlight-color), var(--secondary-color)); opacity: .9; }\n'
              '    .stat-card:hover { transform: translateY(-5px); box-shadow: 0 14px 30px rgba(30,61,89,.14); border-color: rgba(255,110,64,.30); }\n'
              '    .stat-label { display: flex; align-items: center; gap: 8px; margin-bottom: 9px; color: #647487; font-size: .88rem; font-weight: 700; letter-spacing: .01em; }\n'
              '    .stat-icon { width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center; border-radius: 9px; background: rgba(78,137,174,.10); font-size: .90rem; }\n'
              '    .stat-value { color: var(--text-color); font-size: clamp(1.28rem,1.6vw,1.72rem); font-weight: 800; line-height: 1.1; white-space: nowrap; font-variant-numeric: tabular-nums; }\n'
              '    .stat-unit { margin-left: 4px; color: #7c8998; font-size: .72em; font-weight: 700; }\n'
              '    .stat-note { margin-top: 7px; color: #98a3af; font-size: .72rem; line-height: 1.25; }\n'
              '    @media (max-width: 1100px) { .stats-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }\n'
              '    @media (max-width: 700px) { .stats-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }\n'
              '    @media (max-width: 460px) { .stats-grid { grid-template-columns: 1fr; } }\n\n'
          )
          kpi = (
              '            # KPIs básicos descriptivos\n'
              '            st.subheader("Estadísticas descriptivas")\n\n'
              '            promedio = df["Valor"].mean()\n'
              '            maximo = df["Valor"].max()\n'
              '            minimo = df["Valor"].min()\n'
              '            desviacion = df["Valor"].std()\n'
              '            mediana = df["Valor"].median()\n\n'
              '            st.markdown(\n'
              '                f"""\n'
              '                <div class="stats-shell">\n'
              '                    <div class="stats-grid">\n'
              '                        <div class="stat-card" title="Precio promedio del periodo consultado"><div class="stat-label"><span class="stat-icon">◉</span>Promedio</div><div class="stat-value">{promedio:.2f}<span class="stat-unit">COP</span></div><div class="stat-note">Media del periodo</div></div>\n'
              '                        <div class="stat-card" title="Precio máximo registrado en el periodo"><div class="stat-label"><span class="stat-icon">↗</span>Máximo</div><div class="stat-value">{maximo:.2f}<span class="stat-unit">COP</span></div><div class="stat-note">Mayor valor observado</div></div>\n'
              '                        <div class="stat-card" title="Precio mínimo registrado en el periodo"><div class="stat-label"><span class="stat-icon">↘</span>Mínimo</div><div class="stat-value">{minimo:.2f}<span class="stat-unit">COP</span></div><div class="stat-note">Menor valor observado</div></div>\n'
              '                        <div class="stat-card" title="Dispersión de los precios respecto al promedio"><div class="stat-label"><span class="stat-icon">σ</span>Desviación</div><div class="stat-value">{desviacion:.2f}<span class="stat-unit">COP</span></div><div class="stat-note">Variabilidad del periodo</div></div>\n'
              '                        <div class="stat-card" title="Valor central de la distribución ordenada"><div class="stat-label"><span class="stat-icon">◆</span>Mediana</div><div class="stat-value">{mediana:.2f}<span class="stat-unit">COP</span></div><div class="stat-note">Punto medio de los datos</div></div>\n'
              '                    </div>\n'
              '                </div>\n'
              '                """,\n'
              '                unsafe_allow_html=True\n'
              '            )\n\n'
          )
          if '/* Tarjetas compactas para estadísticas descriptivas */' not in text:
              anchor = '    [data-testid="stTable"] {'
              pos = text.find(anchor)
              if pos < 0:
                  raise SystemExit('CSS insertion point not found')
              text = text[:pos] + css + text[pos:]
          start = text.find('            # KPIs básicos descriptivos\n')
          end = text.find('            # Generación y visualización de GIF mensual\n', start)
          if start < 0 or end < 0:
              raise SystemExit('KPI section markers not found')
          text = text[:start] + kpi + text[end:]
          p.write_text(text, encoding='utf-8')
          PY

      - name: Validate Python syntax
        run: python -m py_compile xm.py

      - name: Commit update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add xm.py
          git diff --cached --quiet && exit 0
          git commit -m "style: improve descriptive statistics cards"
          git push
